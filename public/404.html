<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshKZ Hub</title>
    <script>
      const path = window.location.pathname
      const segments = path.split('/').filter(Boolean)
      const repository = segments.length > 0 ? `/${segments[0]}` : ''
      sessionStorage.redirect = `${repository}/index.html${window.location.search}${window.location.hash}`
    </script>
    <meta http-equiv="refresh" content="0;url=/" />
  </head>
  <body>
    <p>Redirigiendo...</p>
  </body>
</html>
