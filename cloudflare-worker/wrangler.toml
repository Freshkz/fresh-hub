name = "freshkz-r2-worker"
main = "r2-worker.js"
compatibility_date = "2024-09-01"

# IMPORTANTE: reemplazá "TU_BUCKET_R2" por el nombre real de tu bucket R2.
# Este binding es el que usa el Worker para /files/... (GET) y DELETE.
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "fresh-hub-downloads"

# Las credenciales para firmar URLs (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY)
# y R2_ACCOUNT_ID / R2_BUCKET_NAME se configuran como secrets, NO acá
# (ver instrucciones de deploy). Nunca subas esas claves a git.
