name = "freshkz-r2-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Binding del bucket: lo usa el Worker para servir (GET) y borrar (DELETE) archivos.
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "fresh-hub-downloads"

# Valores públicos (no son secretos: también están en el JS del sitio).
[vars]
SUPABASE_URL = "https://xowbzkplopxnokuyabht.supabase.co"
# Orígenes que pueden llamar a la API desde el navegador (separados por coma).
ALLOWED_ORIGINS = "https://freshkz.github.io,http://localhost:5173"
# Repos que el proxy de /github-commits puede consultar con tu token.
GITHUB_ALLOWED_REPOS = "Freshkz/fresh-hub"

# Secrets (se cargan con "npx wrangler secret put NOMBRE", NUNCA acá):
#   SUPABASE_ANON_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_ACCOUNT_ID, R2_BUCKET_NAME, GITHUB_TOKEN
